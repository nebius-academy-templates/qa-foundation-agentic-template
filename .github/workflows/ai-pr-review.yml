name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODEL_ID: claude-sonnet-5
  MODEL_EFFORT: low
  MAX_DIFF_BYTES: "120000"
  MAX_OUTPUT_TOKENS: "6000"

jobs:
  explain-human-only-review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.title, '[skip-ai-review]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain why AI review was skipped
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          WAS_SKIPPED: ${{ contains(github.event.pull_request.title, '[skip-ai-review]') }}
        run: |
          {
            echo "## AI PR review not run"
            echo
            echo "This pull request requires human-only review."
            echo
            echo "- Fork: ${IS_FORK}"
            echo "- Dependabot: ${IS_DEPENDABOT}"
            echo "- Title contains \`[skip-ai-review]\`: ${WAS_SKIPPED}"
            echo
            echo "No provider credential was used."
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip-ai-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the trusted base repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the complete PR diff as untrusted data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DIFF_FILE: ${{ runner.temp }}/ai-pr-review.diff
        run: |
          rm -f -- "$PR_DIFF_FILE"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > "$PR_DIFF_FILE"

      - name: Generate the AI review comment
        id: generate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: ${{ runner.temp }}/ai-pr-review.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
        run: |
          rm -f -- "$REVIEW_OUTPUT_FILE"
          bash .github/scripts/ai-pr-review.sh

      - name: Ensure failures route to human review
        if: ${{ !cancelled() }}
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
        run: |
          if [[ "$GENERATION_OUTCOME" != "success" || ! -s "$REVIEW_OUTPUT_FILE" ]]; then
            fallback_file="$(mktemp "${REVIEW_OUTPUT_FILE}.fallback.XXXXXX")"
            trap 'rm -f -- "$fallback_file"' EXIT
            cat > "$fallback_file" <<'EOF'
          ## AI PR review unavailable

          No complete review was produced. Human review is required.
          EOF
            mv -f -- "$fallback_file" "$REVIEW_OUTPUT_FILE"
            trap - EXIT
          fi

          if [[ "$GENERATION_OUTCOME" != "success" ]]; then
            echo "AI review generation failed; a human-review fallback will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the non-blocking recommendation
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
        run: |
          marker='<!-- ai-pr-review-comment:v1 -->'
          comment_file="$(mktemp "$RUNNER_TEMP/ai-pr-review-comment.XXXXXX")"
          payload_file="$(mktemp "$RUNNER_TEMP/ai-pr-review-payload.XXXXXX")"
          trap 'rm -f -- "$comment_file" "$payload_file"' EXIT

          {
            echo "$marker"
            cat "$REVIEW_OUTPUT_FILE"
          } > "$comment_file"

          comment_id="$(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-pr-review-comment:v1 -->"))) | .id' \
              | tail -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            jq -n --rawfile body "$comment_file" '{body: $body}' > "$payload_file"
            gh api --method PATCH \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$payload_file"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$comment_file"
          fi
