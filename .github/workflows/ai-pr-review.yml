name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODEL_ID: claude-sonnet-5
  MODEL_EFFORT: low
  MAX_DIFF_BYTES: "120000"
  MAX_OUTPUT_TOKENS: "6000"

jobs:
  explain-human-only-review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.title, '[skip-ai-review]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain why AI review was skipped
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          WAS_SKIPPED: ${{ contains(github.event.pull_request.title, '[skip-ai-review]') }}
        run: |
          {
            echo "## AI PR review not run"
            echo
            echo "This pull request requires human-only review."
            echo
            echo "- Fork: ${IS_FORK}"
            echo "- Dependabot: ${IS_DEPENDABOT}"
            echo "- Title contains \`[skip-ai-review]\`: ${WAS_SKIPPED}"
            echo
            echo "No provider credential was used."
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip-ai-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the trusted base repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the complete PR diff as untrusted data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DIFF_FILE: ${{ runner.temp }}/ai-pr-review.diff
        run: |
          rm -f -- "$PR_DIFF_FILE"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > "$PR_DIFF_FILE"

      - name: Generate the AI review draft
        id: generate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DIFF_FILE: ${{ runner.temp }}/ai-pr-review.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
        run: |
          rm -f -- "$REVIEW_OUTPUT_FILE"
          bash .github/scripts/ai-pr-review.sh

      - name: Ensure failures route to human review
        if: ${{ !cancelled() }}
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
        run: |
          if [[ "$GENERATION_OUTCOME" != "success" || ! -s "$REVIEW_OUTPUT_FILE" ]]; then
            fallback_file="$(mktemp "${REVIEW_OUTPUT_FILE}.fallback.XXXXXX")"
            trap 'rm -f -- "$fallback_file"' EXIT
            cat > "$fallback_file" <<'EOF'
          ## AI PR review unavailable

          No complete review was produced. Human review is required.
          EOF
            mv -f -- "$fallback_file" "$REVIEW_OUTPUT_FILE"
            trap - EXIT
          fi

          if [[ "$GENERATION_OUTCOME" != "success" ]]; then
            echo "AI review generation failed; a human-review fallback will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the GitHub review payload
        id: build_payload
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DIFF_FILE: ${{ runner.temp }}/ai-pr-review.diff
          REVIEW_OUTPUT_FILE: ${{ runner.temp }}/ai-pr-review.md
          REVIEW_PAYLOAD_FILE: ${{ runner.temp }}/ai-pr-review-payload.json
        run: |
          rm -f -- "$REVIEW_PAYLOAD_FILE"
          python3 .github/scripts/build_ai_review_payload.py build \
            --review "$REVIEW_OUTPUT_FILE" \
            --diff "$PR_DIFF_FILE" \
            --head-sha "$HEAD_SHA" \
            --output "$REVIEW_PAYLOAD_FILE"

      - name: Ensure payload failures route to human review
        if: ${{ !cancelled() }}
        env:
          BUILD_OUTCOME: ${{ steps.build_payload.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PAYLOAD_FILE: ${{ runner.temp }}/ai-pr-review-payload.json
        run: |
          if [[ "$BUILD_OUTCOME" != "success" || ! -s "$REVIEW_PAYLOAD_FILE" ]]; then
            payload_temp="$(mktemp "${REVIEW_PAYLOAD_FILE}.fallback.XXXXXX")"
            trap 'rm -f -- "$payload_temp"' EXIT
            body="$(printf '<!-- ai-pr-review:v2 head=%s review=fallback -->\n## AI PR review unavailable\n\nNo complete review payload was produced. Human review is required.' "$HEAD_SHA")"
            jq -n \
              --arg commit_id "$HEAD_SHA" \
              --arg body "$body" \
              '{commit_id: $commit_id, body: $body, event: "COMMENT", comments: []}' \
              > "$payload_temp"
            mv -f -- "$payload_temp" "$REVIEW_PAYLOAD_FILE"
            trap - EXIT
            echo "AI review payload generation failed; a human-review fallback will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the non-blocking review
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_PAYLOAD_FILE: ${{ runner.temp }}/ai-pr-review-payload.json
        run: |
          reviews_file="$(mktemp "$RUNNER_TEMP/ai-pr-reviews.XXXXXX")"
          trap 'rm -f -- "$reviews_file"' EXIT

          marker="$(
            jq -er \
              '.body | capture("(?<marker><!-- ai-pr-review:v2 [^>]+ -->)").marker' \
              "$REVIEW_PAYLOAD_FILE"
          )"
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$reviews_file"
          existing_review_id="$(
            jq -sr --arg marker "$marker" \
              '[.[][]? | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .id] | last // empty' \
              "$reviews_file"
          )"

          if [[ -n "$existing_review_id" ]]; then
            echo "AI review ${existing_review_id} already contains this exact result." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api --method POST --silent \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --input "$REVIEW_PAYLOAD_FILE"
          fi
